version: '3.8'

services:
  ca-htdnet-dashboard:
    build: .
    container_name: ca_htdnet_platform
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
    restart: unless-stopped
