# System Configuration for Post-Quantum FHIR-Blockchain Architecture
# With Lightweight Intelligent Threat Detection (Phase 0)

project:
  name: "Crypto-Agile FHIR-Blockchain Architecture for Post-Quantum Electronic Health Record Exchange with Lightweight Intelligent Threat Detection"
  version: "1.0.0"
  standard: "HL7 FHIR R4, NIST FIPS 203, NIST FIPS 204, NIST SP 800-38D, FIPS 202"

hardware:
  target_machine: "Apple MacBook Air M2"
  ram_configuration: "8/16 GB"
  max_ram_budget_gb: 6.0
  max_model_parameters: 2000000
  preferred_model_parameters: 1000000
  acceleration:
    preferred_device: "mps"
    fallback_device: "cpu"
    mixed_precision: "evaluated_per_platform"

research_targets:
  target_accuracy: 0.99
  target_precision: 0.99
  target_recall: 0.99
  target_macro_f1: 0.99
  anti_fabrication_rule: "Targets are aspirational research goals. Never fabricate or artificially manipulate metrics. Report empirical findings strictly."
  multi_dimensional_selection:
    - "predictive_quality"
    - "macro_f1"
    - "fpr_fnr_optimization"
    - "inference_latency"
    - "training_time"
    - "parameter_count"
    - "memory_usage"

cryptography:
  suites:
    pqc_standard:
      kem: "ML-KEM-768"
      dsa: "ML-DSA-65"
      symmetric: "AES-256-GCM"
      digest: "SHA-3-256"
    pqc_high:
      kem: "ML-KEM-1024"
      dsa: "ML-DSA-87"
      symmetric: "AES-256-GCM"
      digest: "SHA-3-256"
    classical:
      kem: "ECDH-P256"
      dsa: "ECDSA-P256"
      symmetric: "AES-256-GCM"
      digest: "SHA-256"
    hybrid:
      kem: "ECDH-P256 + ML-KEM-768"
      dsa: "ML-DSA-65"
      symmetric: "AES-256-GCM"
      digest: "SHA-3-256"

blockchain:
  framework: "Hyperledger Fabric"
  zero_plaintext_phi_invariant: true
  offchain_storage: "MinIO/S3-compatible encrypted vault"
  recorded_fields:
    - "sha3_256_hash"
    - "resource_id"
    - "encrypted_object_locator"
    - "consent_status"
    - "authorization_grants"
    - "audit_trail"
    - "revocation_timestamp"

machine_learning:
  threat_dataset: "Edge-IIoTset"
  strict_dataset_separation:
    clinical_ehr: "MIMIC-IV-on-FHIR"
    synthetic_ehr: "Synthea/SyntheticMass"
    cybersecurity_telemetry: "Edge-IIoTset"
  data_split:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    anti_leakage: "Fit preprocessing (scaler, selector, encoder) strictly on train set only."
  primary_architecture:
    type: "Lightweight TCN + Separable 1D Conv + Channel Attention"
    dense_projection_dim: 32
    separable_conv1d_channels: 32
    tcn_residual_blocks: 2
    channel_attention: "Squeeze-and-Excitation (SE)"
    global_pooling: "AdaptiveAvgPool1d"
    dense_head_dim: 32
    dropout: 0.15
  evaluation:
    seeds: [42, 101, 2024, 777, 9999]
    threshold_tuning: "Validation set only. Never tune threshold on test set."
    models_to_benchmark:
      - "Logistic Regression"
      - "Random Forest"
      - "XGBoost / LightGBM"
      - "Small MLP"
      - "Small 1D-CNN"
      - "Small BiLSTM"
      - "Lightweight TCN"
      - "Lightweight TCN + Attention"
      - "Depthwise-Separable CNN"
      - "Proposed Lightweight TCN + Separable Conv1D + Attention"

quality_gates:
  QG1: "Dataset integrity (raw checksums and manifests)"
  QG2: "FHIR validity (schema, references, required fields, temporal consistency)"
  QG3: "Synthetic dataset scale (>100,000 valid records)"
  QG4: "No patient re-identification & zero plaintext PHI in blockchain"
  QG5: "No train/test data leakage (scaler/selector/threshold fitted on train only)"
  QG6: "Cryptographic correctness (ML-KEM, ML-DSA, AES-256-GCM, SHA-3 integrity)"
  QG7: "Blockchain correctness (ledger immutability, consent revocation, audit logs)"
  QG8: "Model reproducibility (deterministic seeds, saved weights and encoders)"
  QG9: "Apple M2 resource compliance (RAM < 6GB, params < 2M, MPS/CPU fallback)"
  QG10: "Statistical validity (multi-seed evaluation, mean, std, 95% CI)"
  QG11: "Dashboard consistency (Streamlit app offline model serving, zero retrain)"
  QG12: "End-to-end clinical exchange validation"
