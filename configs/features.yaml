# Feature configuration and leakage exclusions
leakage_exclusions:
  # Identifiers and timestamps that introduce spurious correlation or time lookahead
  - "frame.time"
  - "ip.src_host"
  - "ip.dst_host"
  - "arp.src.proto_ipv4"
  - "arp.dst.proto_ipv4"
  - "timestamp"
  - "actor_id_hash"
  - "patient_id_hash"
  - "resource_id_hash"
  - "device_id_hash"
  - "source_dataset"
  - "organization"
  - "Attack_label"
  - "Attack_type"
  - "binary_label"
  - "attack_category"
  - "label"

canonical_schema:
  flow_duration: "Duration of the connection / flow in seconds"
  header_length: "Header length in bytes"
  protocol: "Transport layer protocol (TCP=6, UDP=17, ICMP=1, etc.)"
  packet_rate: "Packets transmitted per second"
  byte_rate: "Bytes transmitted per second"
  packet_count: "Total count of packets in flow"
  byte_count: "Total count of bytes in flow"
  fin_flag: "FIN flag indicator or count"
  syn_flag: "SYN flag indicator or count"
  rst_flag: "RST flag indicator or count"
  psh_flag: "PSH flag indicator or count"
  ack_flag: "ACK flag indicator or count"
  urg_flag: "URG flag indicator or count"
  dst_port: "Destination service port"
  request_rate: "Requests per time unit"
  burstiness: "Ratio of peak traffic to mean traffic"

cross_domain_common_features:
  - "flow_duration"
  - "packet_count"
  - "byte_count"
  - "packet_rate"
  - "byte_rate"
  - "dst_port"
  - "protocol"
