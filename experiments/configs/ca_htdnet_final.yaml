experiment:
  id: "CAHTDNET_FINAL_V001"
  name: "Crypto-Agile Healthcare Threat Detection Network (CA-HTDNet) Canonical Benchmark"
  description: "End-to-end reproducible training, validation, ablation, and reconciliation benchmark"
  random_seed: 42
  model_version: "1.0.0"
  dataset_version: "v1.0-harmonized-175k"
  feature_version: "16-features-v1"
  split_version: "stratified-70-15-15"
  calibration_version: "temperature_scaling_v1"

dataset:
  raw_sources:
    ciciot2023: "data/raw/cic_iot/train.csv"
    edge_iiot: "data/raw/edge_iiot/ML-EdgeIIoT-dataset.csv"
    synthetic_fhir: "data/raw/synthetic_fhir/fhir_security_med.parquet"
  processed_arrays: "data/processed/processed_arrays.npz"
  splits:
    train: "data/splits/train.parquet"
    validation: "data/splits/validation.parquet"
    test: "data/splits/test.parquet"
  ratios:
    train: 0.70
    validation: 0.15
    test: 0.15
  features:
    numerical:
      - "flow_duration"
      - "packet_count"
      - "byte_count"
      - "packet_rate"
      - "byte_rate"
      - "dst_port"
      - "protocol"
      - "resource_sensitivity"
      - "auth_status"
      - "failed_auth_count"
      - "request_frequency"
      - "burst_score"
      - "historical_risk"
    categorical:
      - "user_role"
      - "resource_type"
      - "operation"
    target: "binary_label"
    attack_category: "attack_category"

preprocessing:
  scaler: "RobustScaler"
  categorical_encoder: "OrdinalEncoder"
  fit_partition: "TRAIN_ONLY"
  handle_unknown: "use_encoded_value"
  unknown_value: 0

model:
  name: "CA-HTDNet"
  num_numerical: 13
  num_categories: 3
  d_model: 64
  tcn_channels: [32, 64]
  tcn_kernel_size: 3
  attention_heads: 4
  attention_layers: 2
  gru_hidden: 64
  dense_dim: 128
  dropout: 0.10
  num_classes: 2

training:
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 10
  early_stopping:
    monitor: "val_macro_f1"
    patience: 5
    mode: "max"
  loss:
    type: "cost_sensitive_focal"
    gamma: 2.0
    alpha: 0.75
    fn_penalty: 2.0
    use_class_weights: true
  optimizer: "AdamW"
  lr_scheduler: "CosineAnnealingLR"
  device: "auto"

evaluation:
  locked_test_set: true
  metric_engine: "results/result_engine.py"
  metrics:
    - "Accuracy"
    - "Macro_Precision"
    - "Macro_Recall"
    - "Macro_F1"
    - "Weighted_F1"
    - "ROC_AUC"
    - "PR_AUC"
    - "FPR"
    - "FNR"
    - "MCC"
    - "Cohen_Kappa"
